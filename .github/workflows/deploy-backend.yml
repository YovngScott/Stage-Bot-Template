name: Deploy bot fleet to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/client-dashboard/**"
      - "backend/scripts/**"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.json"
      - "backend/fly.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage-bot-fleet
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pinned commits prevent a mutable action tag from changing underneath us.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate tenant files and backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          node scripts/deploy-fleet.mjs --dry-run
      - name: Validate embedded client dashboard
        working-directory: backend/client-dashboard
        run: |
          npm ci
          cp config.public.env .env.production
          npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy shared and dedicated bot apps
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: node scripts/deploy-fleet.mjs
